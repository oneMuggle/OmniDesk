# Offline deployment — self-contained compose, no merge with dev base
# Used with: docker compose -f docker-compose.offline.yml --env-file .env.production up -d
#
# 镜像命名与 GHCR 一致 (ghcr.io/onemuggle/omni-desk-{backend,frontend})
# 默认 tag v0.2.0 来自 .env.production.example,可被 BACKEND_IMAGE_TAG /
# FRONTEND_IMAGE_TAG 环境变量覆盖。pull_policy: never 防止误去 docker hub 拉取。
#
# 离线包通过 build_and_export.sh 在 docker save/load 后用 docker tag 重命名:
#   docker tag omni-desk-backend-prod:v0.2.0  ghcr.io/onemuggle/omni-desk-backend:v0.2.0
#   docker tag omni-desk-frontend-prod:v0.2.0 ghcr.io/onemuggle/omni-desk-frontend:v0.2.0
#
# ─── 固定项目与卷身份 ─────────────────────────────────────────
# 通过顶层 `name: ${COMPOSE_PROJECT_NAME:?...}`(硬门禁)与 volumes 的 explicit `name:`
# 锁定身份,让 alpha/beta/rc/stable/hotfix 多个包目录复用同一 Compose 项目与数据卷,
# 升级时不会因为包目录名变化产生孤儿项目/卷。
#
# 顶层 name 使用 `${VAR:?error}`(POSIX 必需变量)而不是 `${VAR}`(会回退到目录名):
# - 如果用户把 COMPOSE_PROJECT_NAME 从 .env.production 漏掉,compose 会立即报错而不是悄悄回退到
#   当前目录的 basename,那会因为目录名漂移(omnidesk-offline-rc-v0.7.0-rc.1 → 下一版本 v0.7.0-rc.2)
#   触发"孤儿 Compose 项目 / 数据卷",在 docker compose list / volume ls 里都看不到遗失的数据。
# - 与文件中已有 `${POSTGRES_DB:?POSTGRES_DB is required}` 等保持同一种"必需"风格。
# 默认值在 .env.production.example 提供:COMPOSE_PROJECT_NAME=omnidesk-${CHANNEL:-rc}。

name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME must be set in .env.production}

x-common-env: &common-env
  env_file:
    - ./.env.production

services:
  db:
    image: postgres:14-alpine
    command: postgres -c listen_addresses='*'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - omni_desk
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      # SECURITY: Use CMD-SHELL with REDISCLI_AUTH env var to avoid password exposure in process list
      test: ["CMD-SHELL", "REDISCLI_AUTH=${REDIS_PASSWORD} redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - omni_desk
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/onemuggle/omni-desk-backend:${BACKEND_IMAGE_TAG:-v0.4.0}
    pull_policy: never
    <<: *common-env
    environment:
      - DJANGO_SETTINGS_MODULE=omni_desk_backend.settings.production
      - DJANGO_ENV=production
      - COLLECT_STATIC=true
      # RAG 知识库端点:显式声明保证 .env.production 漏配时仍有正确默认值。
      # 注意:backend 故意不 depends_on ragflow —— RAG 是可选能力,ragflow 容器
      # 故障/慢启动不得阻塞主站启动(运行时通过 HTTP 调用,连接失败时优雅降级)。
      - RAGFLOW_API_ENDPOINT=${RAGFLOW_API_ENDPOINT:-http://ragflow:80}
    volumes:
      - static_volume:/usr/src/app/staticfiles
      - media_volume:/usr/src/app/media
      - backup_volume:/usr/src/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - omni_desk
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.5'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  frontend:
    image: ghcr.io/onemuggle/omni-desk-frontend:${FRONTEND_IMAGE_TAG:-v0.4.0}
    pull_policy: never
    ports:
      - "80:80"
    command: ["nginx", "-g", "daemon off;"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - omni_desk
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  worker:
    image: ghcr.io/onemuggle/omni-desk-backend:${BACKEND_IMAGE_TAG:-v0.4.0}
    pull_policy: never
    <<: *common-env
    # SKIP_MIGRATE=true:worker 不跑 migrate,避免与 backend 容器并发触发 UniqueViolation
    environment:
      - SKIP_MIGRATE=true
    command: celery -A omni_desk_backend worker -l info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import subprocess; subprocess.run(['celery', '-A', 'omni_desk_backend', 'status'], check=True, capture_output=True, timeout=10)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - omni_desk
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── RAGFlow MySQL(知识库检索服务的元数据库)────────────────
  # 与 docker-compose.prod.yml 的 ragflow-mysql 定义保持一致。
  # 镜像 tag 固定 mysql:8.0(离线环境通过 docker load 加载,禁止 :latest)。
  ragflow-mysql:
    image: mysql:8.0
    pull_policy: never
    container_name: omnidesk-ragflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD:?RAGFLOW_MYSQL_PASSWORD is required}
      MYSQL_DATABASE: ragflow
      MYSQL_USER: ragflow
      MYSQL_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD:?RAGFLOW_MYSQL_PASSWORD is required}
    volumes:
      - ragflow_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${RAGFLOW_MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - omni_desk
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── RAGFlow(知识库检索服务,智能助手的 RAG 能力来源)─────────
  # 与 docker-compose.prod.yml 的 ragflow 定义保持一致。
  # 镜像 tag 固定 infiniflow/ragflow:v0.16.0(离线环境通过 docker load 加载)。
  # RAG 为可选能力:backend 不依赖本服务启动,本服务挂掉只影响知识库检索,
  # 主站与智能助手的基础对话能力(走 LLM 端点)不受影响。
  ragflow:
    image: infiniflow/ragflow:v0.16.0
    pull_policy: never
    container_name: omnidesk-ragflow
    restart: unless-stopped
    environment:
      MYSQL_PASSWORD: ${RAGFLOW_MYSQL_PASSWORD:?RAGFLOW_MYSQL_PASSWORD is required}
      MYSQL_HOST: ragflow-mysql
      MYSQL_PORT: "3306"
    volumes:
      - ragflow_data:/ragflow/data
    ports:
      - "${RAGFLOW_PORT:-9380}:80"
    depends_on:
      ragflow-mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - omni_desk
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  postgres_data:
    # 固定 external name:不同包目录升级时复用同一 Postgres 数据卷
    # (避免 docker compose 把数据遗弃在孤儿项目里)
    name: ${OMNIDESK_POSTGRES_VOLUME}
  redis_data:
  static_volume:
  media_volume:
    # 固定 external name:不同包目录升级时复用同一 Django media 卷
    name: ${OMNIDESK_MEDIA_VOLUME}
  backup_volume:
  # RAGFlow 数据卷:卷身份由顶层固定项目名(COMPOSE_PROJECT_NAME)锁定,
  # 升级换包目录时随项目名复用,不会产生孤儿卷。
  ragflow_data:
  ragflow_mysql_data:

networks:
  omni_desk:
    driver: bridge
