name: Deploy Test

permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches:
      - main
      - develop

jobs:
  # Task 8: Shell 单元测试 + Django 测试(独立 job,不依赖 Docker 服务)
  shell-and-django-tests:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        working-directory: ./omni_desk_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django tests
        working-directory: ./omni_desk_backend
        run: |
          pytest --ds=omni_desk_backend.settings.test -x --tb=short

      - name: Run shell unit tests
        working-directory: ./deployment/docker
        run: |
          chmod +x tests/*.sh
          # 运行所有 test_*.sh 脚本
          for test_script in tests/test_*.sh; do
            echo "Running $test_script..."
            bash "$test_script" || exit 1
          done

      - name: Run integration test scenarios
        working-directory: ./deployment/docker
        run: |
          chmod +x tests/test_upgrade_integration.sh
          # 运行集成测试(使用 mock,不需要真实 Docker)
          bash tests/test_upgrade_integration.sh --all

  deploy-test:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'develop')
    timeout-minutes: 45
    # 同分支 deploy-test 串行,避免并发 run 用同一个 COMPOSE_PROJECT_NAME
    # 把对方容器/volume down 掉。
    concurrency:
      group: deploy-test-${{ github.event.workflow_run.head_branch || github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Compose
        run: docker compose version

      - name: Prepare deployment identity
        working-directory: ./deployment/docker
        run: |
          set -euo pipefail
          VERSION_VAL=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$VERSION_VAL" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: $VERSION_VAL" >&2
            exit 1
          fi
          IMAGE_TAG="v${VERSION_VAL}"
          echo "VERSION_VAL=$VERSION_VAL" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "VERSION file: $VERSION_VAL"
          echo "Image tag: $IMAGE_TAG"

      - name: Build backend image locally
        # deploy-test 在 workflow_run 触发的 job 中 GITHUB_TOKEN 没有 packages:read scope,
        # 无法拉取 GHCR 镜像。改为本地 build + tag 成 GHCR 全名,
        # 保留 docker-compose.offline.yml 的 pull_policy: never(契约要求;Task 8 强制)。
        # 镜像 tag 由 deployment/docker/VERSION 推导(见 Prepare deployment identity),
        # 与当前 checkout 的 commit 自洽;CI 不再固定使用 v0.4.0 等历史 tag。
        run: |
          docker build \
            -f deployment/docker/omni_desk_backend/Dockerfile \
            --target production \
            --platform linux/amd64 \
            -t "ghcr.io/onemuggle/omni-desk-backend:${IMAGE_TAG}" \
            .

      - name: Build frontend image locally
        run: |
          docker build \
            -f omni_desk_frontend/Dockerfile \
            --target production \
            --platform linux/amd64 \
            -t "ghcr.io/onemuggle/omni-desk-frontend:${IMAGE_TAG}" \
            omni_desk_frontend/

      - name: Create .env.production for CI
        working-directory: ./deployment/docker
        run: |
          # Generate a temporary .env.production for CI testing
          cp .env.production.example .env.production
          SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(50))")
          sed -i "s/POSTGRES_USER=.*/POSTGRES_USER=testuser/" .env.production
          sed -i "s/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=testpass123/" .env.production
          sed -i "s/SECRET_KEY=.*/SECRET_KEY=$SECRET_KEY/" .env.production
          sed -i "s/REDIS_PASSWORD=.*/REDIS_PASSWORD=redispass123/" .env.production
          sed -i "s/DJANGO_ALLOWED_HOSTS=.*/DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1/" .env.production
          sed -i "s/CORS_ALLOWED_ORIGINS=.*/CORS_ALLOWED_ORIGINS=http:\/\/localhost/" .env.production
          sed -i "s/CSRF_TRUSTED_ORIGINS=.*/CSRF_TRUSTED_ORIGINS=http:\/\/localhost/" .env.production
          # 强制覆盖 COMPOSE_PROJECT_NAME 为 CI 专用名(每次运行唯一),
          # 避免与本地开发容器或并发 CI run 共享项目/卷。
          sed -i "s/^COMPOSE_PROJECT_NAME=.*/COMPOSE_PROJECT_NAME=omnidesk-ci-${{ github.run_id }}-${{ github.run_attempt }}/" .env.production
          sed -i "s/^BACKEND_IMAGE_TAG=.*/BACKEND_IMAGE_TAG=$IMAGE_TAG/" .env.production
          sed -i "s/^FRONTEND_IMAGE_TAG=.*/FRONTEND_IMAGE_TAG=$IMAGE_TAG/" .env.production
          echo "Generated .env.production for CI with IMAGE_TAG=$IMAGE_TAG"

      - name: Verify workflow identity
        working-directory: ./deployment/docker
        run: |
          set -euo pipefail
          BACKEND_TAG=$(grep '^BACKEND_IMAGE_TAG=' .env.production | cut -d= -f2-)
          FRONTEND_TAG=$(grep '^FRONTEND_IMAGE_TAG=' .env.production | cut -d= -f2-)
          COMPOSE_PROJ=$(grep '^COMPOSE_PROJECT_NAME=' .env.production | cut -d= -f2-)
          test "$BACKEND_TAG" = "$IMAGE_TAG"
          test "$FRONTEND_TAG" = "$IMAGE_TAG"
          test "$BACKEND_TAG" = "$FRONTEND_TAG"
          test -n "$COMPOSE_PROJ"
          COMPOSE_CONFIG=$(mktemp)
          trap 'rm -f "$COMPOSE_CONFIG"' EXIT
          docker compose --env-file .env.production -f docker-compose.offline.yml config > "$COMPOSE_CONFIG"
          grep -Fq "ghcr.io/onemuggle/omni-desk-backend:${IMAGE_TAG}" "$COMPOSE_CONFIG"
          grep -Fq "ghcr.io/onemuggle/omni-desk-frontend:${IMAGE_TAG}" "$COMPOSE_CONFIG"
          COMMIT_SHORT=$(printf '%s' "$COMMIT_SHA" | cut -c1-12)
          echo "✅ Identity verified: VERSION=$VERSION_VAL IMAGE_TAG=$IMAGE_TAG commit=$COMMIT_SHORT"

      - name: Start services
        working-directory: ./deployment/docker
        run: |
          #   deploy-test job 已本地 build 镜像并 tag 成 GHCR 全名(见 Build backend/frontend image locally),
          #   docker-compose.offline.yml 默认 pull_policy: never 直接命中本地 tag,无需 fallback 到 missing。
          #   保留 never 是离线部署契约(Task 8 Step 4 强制要求)。
          # 显式 --env-file 避免 docker compose 自动加载 cwd 中的 .env 文件污染变量
          # (deployment/docker/.env 是 dev 用,含 POSTGRES_USER=user 等值会覆盖 .env.production 的 testuser)
          docker compose --env-file .env.production -f docker-compose.offline.yml up -d
          echo "Waiting for services to be healthy..."
          timeout 300 bash -c '
            while true; do
              all_healthy=true
              for svc in db redis backend frontend; do
                cid=$(docker compose --env-file .env.production -f docker-compose.offline.yml ps -q $svc 2>/dev/null)
                health=$(docker inspect --format="{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}" "$cid" 2>/dev/null || echo "unknown")
                if [ "$health" != "healthy" ]; then
                  echo "  $svc: $health"
                  all_healthy=false
                fi
              done
              if [ "$all_healthy" = true ]; then
                echo "All services healthy"
                break
              fi
              sleep 5
            done
          '

      - name: Run deploy tests
        working-directory: ./deployment/docker
        env:
          # Task 8 Step 4 严格部署契约:
          #   - SMOKE_STRICT=1:任何 SKIP / WARN 必须使最终测试失败
          #   - SMOKE_ALLOW_NETWORK_SKIP=0:网络瞬态必须 FAIL,不允许降级为 SKIP
          #   - SMOKE_RUN_ID:由 job id 隔离,避免与本地开发或其他 CI run 串扰
          SMOKE_STRICT: "1"
          SMOKE_ALLOW_NETWORK_SKIP: "0"
          SMOKE_ALLOW_RATE_LIMIT_SKIP: "0"
          SMOKE_RUN_ID: deploy-test-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          chmod +x deploy_tests.sh
          ./deploy_tests.sh http://localhost

      - name: Create smoke test user
        working-directory: ./deployment/docker
        env:
          # 部署验收要求:J2/J3 等登录步骤与 J6 角色化断言
          # 都必须基于一个真实存在的非管理员账号。
          # 优先读 SMOKE_TEST_USER/PASSWORD secrets(语义最准);
          # fallback 到 E2E_USERNAME/PASSWORD(避免 secrets 重复维护)。
          # 都没设 → fail-fast,不留静默 SKIP。
          SMOKE_TEST_USER: ${{ secrets.SMOKE_TEST_USER || secrets.E2E_USERNAME }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD || secrets.E2E_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SMOKE_TEST_USER" ] || [ -z "$SMOKE_TEST_PASSWORD" ]; then
            echo "❌ smoke 账号凭据未配置:需要 secrets.SMOKE_TEST_USER/PASSWORD 或 secrets.E2E_USERNAME/PASSWORD"
            exit 1
          fi
          # 在 backend 容器内调用 Django 管理命令,生产 settings;
          # --reset 强制幂等:不论是否已存在都把密码与锁定属性对齐 CI 期望。
          docker compose --env-file .env.production -f docker-compose.offline.yml \
            exec -T \
            -e SMOKE_TEST_USER \
            -e SMOKE_TEST_PASSWORD \
            -e DJANGO_SETTINGS_MODULE=omni_desk_backend.settings.production \
            backend python manage.py create_smoke_user --reset
          echo "✅ smoke user created/reset: $SMOKE_TEST_USER"

      - name: Set up Node.js for Browser E2E
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: omni_desk_frontend/package-lock.json

      - name: Install frontend dependencies for Browser E2E
        working-directory: ./omni_desk_frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./omni_desk_frontend
        run: npx playwright install --with-deps chromium

      - name: Run Browser E2E
        working-directory: ./omni_desk_frontend
        env:
          E2E_BASE_URL: http://localhost
          # J2/J3 等通用登录用 E2E_USERNAME/PASSWORD
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          # J6 角色化用 E2E_USER_USERNAME/PASSWORD;
          # 显式注入同一 smoke 账号,禁止再以 username 关键字 skip。
          E2E_USER_USERNAME: ${{ secrets.SMOKE_TEST_USER || secrets.E2E_USERNAME }}
          E2E_USER_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD || secrets.E2E_PASSWORD }}
          E2E_AUTH_MODE: env
          SMOKE_RUN_ID: browser-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$E2E_USERNAME" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "❌ secrets.E2E_USERNAME / E2E_PASSWORD 未配置"
            echo "   在 repo Settings → Secrets → Actions 配置凭据后重跑"
            exit 1
          fi
          npm run test:e2e

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: deploy-test-results
          path: |
            deployment/docker/test-results/
            omni_desk_frontend/test-artifacts/screenshots/
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        working-directory: ./deployment/docker
        run: |
          set -euo pipefail
          # 用 --env-file .env.production 与 Start 步骤保持一致,
          # 避免 docker compose 自动加载 cwd 的 .env(不含 COMPOSE_PROJECT_NAME)
          docker compose --env-file .env.production -f docker-compose.offline.yml down -v
          echo "Services stopped and volumes removed"
