name: Deploy Test

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches:
      - main
      - develop

jobs:
  # Task 8: Shell 单元测试 + Django 测试(独立 job,不依赖 Docker 服务)
  shell-and-django-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        working-directory: ./omni_desk_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django tests
        working-directory: ./omni_desk_backend
        run: |
          pytest --ds=omni_desk_backend.settings.test -x --tb=short

      - name: Run shell unit tests
        working-directory: ./deployment/docker
        run: |
          chmod +x tests/*.sh
          # 运行所有 test_*.sh 脚本
          for test_script in tests/test_*.sh; do
            echo "Running $test_script..."
            bash "$test_script" || exit 1
          done

      - name: Run integration test scenarios
        working-directory: ./deployment/docker
        run: |
          chmod +x tests/test_upgrade_integration.sh
          # 运行集成测试(使用 mock,不需要真实 Docker)
          bash tests/test_upgrade_integration.sh --all

  deploy-test:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose version

      - name: Build backend image locally
        # deploy-test 在 workflow_run 触发的 job 中 GITHUB_TOKEN 没有 packages:read scope,
        # 无法拉取 GHCR 镜像。改为本地 build + tag 成 GHCR 全名,
        # 让 offline.yml 用本地镜像 (pull_policy: missing 允许 fallback)。
        # 镜像 tag 锁死 v0.4.0(与 .env.production.example / docker-compose.offline.yml 默认值一致)
        run: |
          docker build \
            -f deployment/docker/omni_desk_backend/Dockerfile \
            --target production \
            --platform linux/amd64 \
            -t ghcr.io/onemuggle/omni-desk-backend:v0.4.0 \
            .

      - name: Build frontend image locally
        run: |
          docker build \
            -f omni_desk_frontend/Dockerfile \
            --target production \
            --platform linux/amd64 \
            -t ghcr.io/onemuggle/omni-desk-frontend:v0.4.0 \
            omni_desk_frontend/

      - name: Create .env.production for CI
        working-directory: ./deployment/docker
        run: |
          # Generate a temporary .env.production for CI testing
          cp .env.production.example .env.production
          SECRET_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(50))")
          sed -i "s/POSTGRES_USER=.*/POSTGRES_USER=testuser/" .env.production
          sed -i "s/POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=testpass123/" .env.production
          sed -i "s/SECRET_KEY=.*/SECRET_KEY=$SECRET_KEY/" .env.production
          sed -i "s/REDIS_PASSWORD=.*/REDIS_PASSWORD=redispass123/" .env.production
          sed -i "s/DJANGO_ALLOWED_HOSTS=.*/DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1/" .env.production
          sed -i "s/CORS_ALLOWED_ORIGINS=.*/CORS_ALLOWED_ORIGINS=http:\/\/localhost/" .env.production
          sed -i "s/CSRF_TRUSTED_ORIGINS=.*/CSRF_TRUSTED_ORIGINS=http:\/\/localhost/" .env.production
          # 强制覆盖 COMPOSE_PROJECT_NAME 为 CI 专用名,避免与本地开发容器冲突
          sed -i "s/^COMPOSE_PROJECT_NAME=.*/COMPOSE_PROJECT_NAME=omnidesk-ci-test/" .env.production
          echo "Generated .env.production for CI"

      - name: Start services
        working-directory: ./deployment/docker
        run: |
          # 临时把 backend/frontend 的 pull_policy 从 'never' 改为 'missing',
          # 让 deploy test runner 在本地无镜像时从 GHCR 拉取(已 login)
          # (本 job 已经在前面步骤本地 build 了镜像,所以会优先用本地)
          sed -i 's|pull_policy: never|pull_policy: missing|g' docker-compose.offline.yml
          # 显式 --env-file 避免 docker compose 自动加载 cwd 中的 .env 文件污染变量
          # (deployment/docker/.env 是 dev 用,含 POSTGRES_USER=user 等值会覆盖 .env.production 的 testuser)
          docker compose --env-file .env.production -f docker-compose.offline.yml up -d
          echo "Waiting for services to be healthy..."
          timeout 300 bash -c '
            while true; do
              all_healthy=true
              for svc in db redis backend frontend; do
                cid=$(docker compose --env-file .env.production -f docker-compose.offline.yml ps -q $svc 2>/dev/null)
                health=$(docker inspect --format="{{if .State.Health}}{{.State.Health.Status}}{{else}}running{{end}}" "$cid" 2>/dev/null || echo "unknown")
                if [ "$health" != "healthy" ]; then
                  echo "  $svc: $health"
                  all_healthy=false
                fi
              done
              if [ "$all_healthy" = true ]; then
                echo "All services healthy"
                break
              fi
              sleep 5
            done
          '

      - name: Run deploy tests
        working-directory: ./deployment/docker
        run: |
          chmod +x deploy_tests.sh
          ./deploy_tests.sh http://localhost

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: deploy-test-results
          path: deployment/docker/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        working-directory: ./deployment/docker
        run: |
          # 用 --env-file .env.production 与 Start 步骤保持一致,
          # 避免 docker compose 自动加载 cwd 的 .env(不含 COMPOSE_PROJECT_NAME)
          docker compose --env-file .env.production -f docker-compose.offline.yml down -v
          echo "Services stopped and volumes removed"
